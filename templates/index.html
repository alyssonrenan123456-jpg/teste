<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Integrada - Agendamentos e Plantão</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-card: rgba(255, 255, 255, 0.03);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #a855f7;
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-border: rgba(239, 68, 68, 0.3);
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Efeitos de Aura no Fundo */
        .aura-blob {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
            animation: floatBlob 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .blob-1 { top: -100px; left: -100px; }
        .blob-2 { bottom: -100px; right: -100px; animation-delay: -5s; background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, rgba(99, 102, 241, 0) 70%); }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 750px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Abas Estilizadas */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* Grupos de Inputs */
        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        input[type="text"]::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        button.btn-search {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            margin-top: 5px;
        }

        button.btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        button.btn-search:active {
            transform: translateY(0);
        }

        /* Cards de Resultados Glassmorphism */
        #resultadosContainer {
            margin-top: 25px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 4px;
        }

        #resultadosContainer::-webkit-scrollbar {
            width: 6px;
        }
        #resultadosContainer::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .result-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-left: 4px solid var(--primary);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease forwards;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card p {
            margin: 8px 0;
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-card p strong {
            color: var(--text-main);
        }

        .responsavel {
            font-size: 16px !important;
            color: #c084fc !important;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px !important;
            border: 1px solid rgba(168, 85, 247, 0.2);
            display: block !important;
        }

        .sem-plantao {
            color: var(--error-text) !important;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            padding: 8px 12px;
            border-radius: 8px;
            display: block !important;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 25px;
            font-size: 15px;
            background: rgba(0,0,0,0.15);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .erro-msg {
            color: var(--error-text);
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="aura-blob blob-1"></div>
    <div class="aura-blob blob-2"></div>

    <div class="container">
        <h1>🔍 Consulta Integrada</h1>

        <div class="tabs">
            <button class="tab-btn active" id="btnAgendamento" type="button" onclick="window.setTipo('agendamento')">Agendamentos (Por Cidade)</button>
            <button class="tab-btn" id="btnPlantao" type="button" onclick="window.setTipo('plantao')">Técnicos de Plantão</button>
        </div>

        <div class="input-group">
            <label id="labelInput" for="buscaInput">Nome da Cidade</label>
            <input type="text" id="buscaInput" placeholder="Ex: Joaçaba, Lages, Caçador..." onkeypress="window.tratarEnter(event)">
        </div>

        <button class="btn-search" type="button" onclick="window.realizarBusca()">Pesquisar em Tempo Real</button>

        <div id="resultadosContainer"></div>
    </div>

    <script>
        // Funções anexadas diretamente no escopo global (window) para garantir total acesso pelos botões HTML
        window.tipoAtual = 'agendamento';

        window.setTipo = function(tipo) {
            window.tipoAtual = tipo;
            const btnAgendamento = document.getElementById('btnAgendamento');
            const btnPlantao = document.getElementById('btnPlantao');
            
            if (btnAgendamento && btnPlantao) {
                btnAgendamento.classList.toggle('active', tipo === 'agendamento');
                btnPlantao.classList.toggle('active', tipo === 'plantao');
            }
            
            const input = document.getElementById('buscaInput');
            const label = document.getElementById('labelInput');
            
            if (input && label) {
                if (tipo === 'agendamento') {
                    label.textContent = "Nome da Cidade";
                    input.placeholder = "Ex: Joaçaba, Lages, Caçador...";
                } else {
                    label.textContent = "Filial ou Cidade";
                    input.placeholder = "Ex: MCA, 01, LGS, Fraiburgo...";
                }
            }
            
            const container = document.getElementById('resultadosContainer');
            if (container) container.innerHTML = '';
        };

        window.tratarEnter = function(e) {
            if (e.key === 'Enter') {
                window.realizarBusca();
            }
        };

        window.realizarBusca = async function() {
            const inputEl = document.getElementById('buscaInput');
            const container = document.getElementById('resultadosContainer');
            
            if (!inputEl || !container) return;

            const termo = inputEl.value.trim();

            if (!termo) {
                container.innerHTML = '<div class="status-msg">⚠️ Por favor, digite um termo para buscar.</div>';
                return;
            }

            container.innerHTML = '<p class="status-msg">⏳ Consultando Google Sheets em tempo real...</p>';

            try {
                const response = await fetch('/api/buscar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ termo: termo, tipo: window.tipoAtual })
                });

                const resposta = await response.json();

                if (resposta.sucesso && resposta.dados && resposta.dados.length > 0) {
                    if (window.tipoAtual === 'agendamento') {
                        container.innerHTML = resposta.dados.map(item => `
                            <div class="result-card">
                                <p><strong>Cidade:</strong> <span>${item.cidade}</span></p>
                                <p><strong>Regional:</strong> <span>${item.regional}</span></p>
                                <p><strong>Conectados / FTTH:</strong> <span>${item.conectados} | ${item.ttth}</span></p>
                                <div class="responsavel">👤 Responsável: ${item.responsavel}</div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = resposta.dados.map(item => `
                            <div class="result-card">
                                <p><strong>Filial / Cidade:</strong> <span>${item.filial} - ${item.cidade}</span></p>
                                <p><strong>Status Sobreaviso:</strong> <span>${item.status}</span></p>
                                <div class="${item.tecnico_sabado.includes('Nenhum') || item.tecnico_sabado.includes('NENHUMA') ? 'sem-plantao' : 'responsavel'}">
                                    📅 Sábado: ${item.tecnico_sabado} ${item.jornada_sabado !== '-' ? '(' + item.jornada_sabado + ')' : ''}
                                </div>
                                <div class="${item.tecnico_domingo.includes('Nenhum') || item.tecnico_domingo.includes('NENHUMA') ? 'sem-plantao' : 'responsavel'}">
                                    📅 Domingo: ${item.tecnico_domingo} ${item.jornada_domingo !== '-' ? '(' + item.jornada_domingo + ')' : ''}
                                </div>
                            </div>
                        `).join('');
                    }
                } else if (resposta.sucesso && (!resposta.dados || resposta.dados.length === 0)) {
                    const msg = resposta.mensagem || "Nenhum resultado encontrado.";
                    container.innerHTML = `<p class="status-msg">⚠️ <strong>${msg}</strong></p>`;
                } else {
                    container.innerHTML = `<div class="erro-msg">${resposta.erro || 'Erro desconhecido ao processar.'}</div>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<div class="erro-msg">❌ Erro de conexão ao tentar falar com o servidor.</div>';
            }
        };
    </script>
</body>
</html>
